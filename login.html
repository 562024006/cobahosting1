<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal Administratif Mahasiswa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 450px;
      border-radius: 24px !important;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.6) !important;
      box-shadow: 0 15px 35px rgba(8, 77, 81, 0.12) !important;
    }
    .brand-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--primary-teal) 0%, var(--medium-teal) 100%);
      color: white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 20px auto;
      box-shadow: 0 8px 20px rgba(11, 94, 99, 0.25);
    }
    .form-control {
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(11, 94, 99, 0.15);
      background-color: rgba(255, 255, 255, 0.6);
      transition: var(--transition-smooth);
    }
    .form-control:focus {
      border-color: var(--accent-teal);
      box-shadow: 0 0 0 4px rgba(28, 133, 138, 0.15);
      background-color: #ffffff;
    }
    .btn-login {
      background: linear-gradient(135deg, var(--primary-teal) 0%, var(--medium-teal) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      transition: var(--transition-smooth);
      box-shadow: 0 6px 20px rgba(11, 94, 99, 0.2);
    }
    .btn-login:hover {
      background: linear-gradient(135deg, var(--medium-teal) 0%, var(--primary-teal) 100%);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(11, 94, 99, 0.3);
    }
    .credential-box {
      background: rgba(11, 94, 99, 0.05);
      border: 1px dashed rgba(11, 94, 99, 0.2);
      border-radius: 14px;
      padding: 15px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="card login-card text-center">
      
      <div class="brand-logo">
        <i class="fas fa-university"></i>
      </div>
      
      <h3 class="fw-bold text-dark mb-1">Selamat Datang</h3>
      <p class="text-muted small mb-4">Portal Administratif Mahasiswa</p>
      
      <div id="errorAlert" class="alert alert-danger py-2 px-3 mb-3 small d-none" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> NIM atau Password salah!
      </div>
      
      <form id="loginForm" class="text-start">
        <div class="mb-3">
          <label for="nim" class="form-label small fw-semibold text-muted">NIM</label>
          <input type="text" id="nim" name="nim" class="form-control" placeholder="Masukkan NIM Anda" required>
        </div>
        
        <div class="mb-4">
          <label for="password" class="form-label small fw-semibold text-muted">Password</label>
          <div class="input-group">
            <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan Password Anda" required>
          </div>
        </div>
        
        <button type="submit" class="btn btn-login w-100 mb-4">
          <i class="fas fa-sign-in-alt me-2"></i> Masuk ke Portal
        </button>
      </form>
      
      <div class="credential-box text-start small">
        <div class="fw-bold text-teal mb-1"><i class="fas fa-key me-1"></i> Akun Uji Coba:</div>
        <div class="text-muted">
          <div>NIM: <code class="user-select-all text-dark">11223344</code></div>
          <div>Password: <code class="user-select-all text-dark">rahasia123</code></div>
        </div>
      </div>
      
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    // Redirect if already logged in
    const activeSession = localStorage.getItem('active_session');
    if (activeSession) {
      window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nimVal = document.getElementById('nim').value.trim();
      const passVal = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      
      const success = login(nimVal, passVal);
      
      if (success) {
        window.location.href = 'index.html';
      } else {
        errorAlert.classList.remove('d-none');
        setTimeout(() => {
          errorAlert.classList.add('d-none');
        }, 3000);
      }
    });
  </script>
</body>
</html>
